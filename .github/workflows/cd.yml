name: Continuous Deployment

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            FILES=$(git diff --name-only 4b825dc642cb6eb9a060e54bf899d15006303f28 ${{ github.sha }})
          else
            FILES=$(git diff --name-only "$BEFORE" ${{ github.sha }})
          fi

          echo "$FILES"

          echo "backend=false" >> $GITHUB_OUTPUT
          echo "frontend=false" >> $GITHUB_OUTPUT
          echo "ws=false" >> $GITHUB_OUTPUT

          if echo "$FILES" | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          fi

          if echo "$FILES" | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          fi

          if echo "$FILES" | grep -q "^ws-server/"; then
            echo "ws=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/be.dockerfile
          push: true
          tags: aravmenon12/trial-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/fe.dockerfile
          push: true
          tags: aravmenon12/trial-fe:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-trial.arav.space
            NEXT_PUBLIC_WS_URL=wss://ws-api.arav.space
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push WS
        if: steps.changes.outputs.ws == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/ws.dockerfile
          push: true
          tags: aravmenon12/trial-ws:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Clone staging-ops
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/Arav-Menon/staging-ops.git
          cd staging-ops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          if [[ "${{ steps.changes.outputs.backend }}" == "true" ]]; then
            yq -i '.image.tag = "${{ github.sha }}"' prod/trial/backend/values.yaml
          fi

          if [[ "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            yq -i '.image.tag = "${{ github.sha }}"' prod/trial/frontend/values.yaml
          fi

          if [[ "${{ steps.changes.outputs.ws }}" == "true" ]]; then
            yq -i '.image.tag = "${{ github.sha }}"' prod/trial/ws/values.yaml
          fi

          git add .

          git diff --cached --quiet || git commit -m "Update image tags to ${{ github.sha }}"

          git push origin prod
